services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: events_aggregator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d events_aggregator"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/events_aggregator
      EVENTS_PROVIDER_BASE_URL: ${EVENTS_PROVIDER_BASE_URL}
      EVENTS_PROVIDER_API_KEY: ${EVENTS_PROVIDER_API_KEY}
      SYNC_INTERVAL_SECONDS: 86400
      SEATS_CACHE_TTL_SECONDS: 30
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
